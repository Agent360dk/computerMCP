name: Fremmed Mac

# En Mac der ikke er Gustavs: GitHubs egen koerer.
#
# ⛔ HVORFOR DEN FINDES (27/9-2026)
#    Slutkriterie 1: hver vej gennem produktet skal vaere bevist paa en maskine
#    der IKKE er Gustavs. Hans egen Mac maa kun laeses («maal aldrig paa min
#    skaerm»). CI-filen siger, at tilgaengelighed «ikke kan gives paa en
#    byggekoerer» - det er aldrig maalt. Her maales det med de rettigheder
#    koereren leveres med; intet aendres i dem. Har koereren ikke adgangen,
#    siger `permissions` det, og proeverne fejler synligt.
on:
  push:
    branches: ['proeve/**']
  workflow_dispatch:

jobs:
  fremmed-mac:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CMCP_FREMMED_MASKINE: '1'
      CMCP_STATUS_IKON: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Maskinen
        run: |
          sw_vers; uname -m
          defaults read -g AppleLanguages || true
          ls /Applications

      # Samme bygning som udgivelsen: hjaelperen til begge arkitekturer OG
      # menulinje-ikonet (koersel 3: statusikon-proeven fandt intet ikon).
      - name: Byg som udgivelsen
        run: |
          bash scripts/build-release.sh
          mcp-server/vendor/cmcp-helper version

      - name: Afhaengigheder
        run: cd mcp-server && npm ci --no-audit --no-fund

      - name: Rettigheder som koereren leveres
        run: mcp-server/vendor/cmcp-helper permissions || true

      # Sloerings-proeven laeser billeder med Pillow (samme som ci.yml).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow
        run: python -m pip install --quiet --disable-pip-version-check pillow

      # Uden et menneske er Finder forrest, og produktet roerer (med rette) aldrig
      # det program mennesket bruger. Et menneske ville arbejde i et andet program
      # - ogsaa mens suiten koerer (koersel 3: to suiter ramte Finder).
      - name: Et menneske arbejder i et andet program (suiten)
        run: |
          open -a "Script Editor"; sleep 4
          mcp-server/vendor/cmcp-helper focused || true

      - name: Hele suiten
        id: suite
        continue-on-error: true
        run: |
          export TMPDIR="$RUNNER_TEMP/"
          # GitHub koerer trinnet med bash -e: uden «|| rc=» stoppede det ved
          # foerste fejl, og loggen blev aldrig kopieret (koersel 1, 27/9).
          rc=0; bash test/run-all.sh || rc=$?
          cp "$RUNNER_TEMP"/cmcp-suite-*.log "$RUNNER_TEMP/suite.log" || true
          exit $rc

      - name: Mutationsbevis for giv-tilbage (proeven tager forgrunden, saa kun her)
        id: mutant
        continue-on-error: true
        # 29/9 (B7): og hver port-vagt (samtykke, sende-port, skaerm-laan, omveje)
        # skal kunne blive roed. bash -e: uden «|| rc» stoppede trinnet ved foerste.
        run: |
          rc=0
          bash .github/mutant-giv-tilbage.sh || rc=1
          python3 .github/mutant-porte.py || rc=1
          exit $rc

      # Uden et menneske er Finder forrest, og produktet roerer (med rette) aldrig
      # det program mennesket bruger. Et menneske ville arbejde i et andet program.
      - name: Et menneske arbejder i et andet program
        run: |
          killall Chess Calculator Contacts "System Settings" "Activity Monitor" Notes "Photo Booth" "Google Chrome" Safari 2>/dev/null || true
          # Skak genskaber det gamle parti ved start (koersel 4): nulstil det gemte.
          rm -rf ~/Library/Containers/com.apple.Chess/Data/Library/Saved\ Application\ State ~/Library/Saved\ Application\ State/com.apple.Chess.savedState
          open -a "Script Editor"; sleep 4
          mcp-server/vendor/cmcp-helper focused || true

      - name: Brugsscenarierne i baggrunden
        id: bg
        continue-on-error: true
        run: CMCP_BRUG=laes,lokal,kamera CMCP_BRUG_RAPPORT="$RUNNER_TEMP/baggrund.json" node test/brugsscenarier.mjs

      - name: Hvad maskinen viste efter baggrunden
        if: always()
        run: bash .github/diagnose.sh baggrund

      - name: Nulstil til forgrunden
        run: |
          killall Chess Calculator Contacts "System Settings" "Activity Monitor" Notes "Photo Booth" "Google Chrome" Safari 2>/dev/null || true
          # Skak genskaber det gamle parti ved start (koersel 4): nulstil det gemte.
          rm -rf ~/Library/Containers/com.apple.Chess/Data/Library/Saved\ Application\ State ~/Library/Saved\ Application\ State/com.apple.Chess.savedState
          sleep 2

      - name: Brugsscenarierne i forgrunden
        id: fg
        continue-on-error: true
        run: CMCP_BRUG=laes,lokal,kamera CMCP_BRUG_TILSTAND=forgrund CMCP_BRUG_TAG_SKAERMEN=1 CMCP_BRUG_RAPPORT="$RUNNER_TEMP/forgrund.json" node test/brugsscenarier.mjs

      - name: Hvad maskinen viste efter forgrunden
        if: always()
        run: bash .github/diagnose.sh forgrund

      - name: Beviserne
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fremmed-mac-beviser
          path: |
            ${{ runner.temp }}/suite.log
            ${{ runner.temp }}/baggrund.json
            ${{ runner.temp }}/forgrund.json
            ${{ runner.temp }}/diag/

      # ⛔ 28/9: foer var suite, mutant og de to scenarie-koersler alle
      #    continue-on-error uden en samlende port - en groen koersel beviste
      #    intet om proeverne. Nu fejler jobbet, hvis en af dem ikke bestod.
      #    (Beviserne uploades ovenfor med if: always, saa de findes stadig.)
      - name: Porten - en fejlet proeve goer hele jobbet roedt
        if: always()
        run: |
          fail=0
          for par in "Suiten:${{ steps.suite.outcome }}" \
                     "Mutationsbeviset:${{ steps.mutant.outcome }}" \
                     "Baggrunds-scenarier:${{ steps.bg.outcome }}" \
                     "Forgrunds-scenarier:${{ steps.fg.outcome }}"; do
            navn="${par%%:*}"; res="${par##*:}"
            echo "$navn: $res"
            [ "$res" = "success" ] || { echo "⛔ $navn bestod ikke ($res)"; fail=1; }
          done
          [ "$fail" = "0" ] && echo "Alle fire porte grønne." || exit 1
