name: Release

# Koerer paa et version-maerke. Bygger den binaer der faktisk sendes ud og
# haenger den paa udgivelsen, saa en bruger kan hente den uden at have Swift.
#
# npm-udgivelsen staar med vilje IKKE her: en udgivelse der sker automatisk
# paa et maerke er en udgivelse ingen naaede at se paa foerst.
#
# Den bor i `scripts/release.sh`, koert af et menneske i en rigtig terminal: npm
# aabner da godkendelsen med sikkerhedsnoeglen i browseren (MAALT 6/10, npm 10.9.4
# lib/utils/auth.js - kun med stdin og stdout som terminal). 7/10 (panel R8): den
# tidligere `udgiv-npm.yml` er fjernet - den havde aldrig koert og manglede
# PUBLICERET, tekstsynkroniseringen, deprecate og registret. Én vej, ikke to.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Maerke at bygge (uden at udgive)'
        required: false

permissions:
  contents: write

jobs:
  universal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Byg, signer og efterproev
        run: ./scripts/build-release.sh

      # Prøverne koeres mod PRAECIS den binaer der sendes ud, ikke mod en
      # lokalt bygget udgave af samme kilde. En binaer der ikke er proevet,
      # er ikke den samme binaer.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Afhaengigheder
        run: |
          cd mcp-server && npm ci --no-audit --no-fund
          python -m pip install --quiet --disable-pip-version-check pillow

      - name: Proev den udsendte binaer
        run: |
          python test/redaction-unit.py
          node test/claims-offline.mjs

      # ⛔ 7/10 (panel R8-R9, punkt M): ét-kliks-installation til Claude Desktop - ogsaa
      #    Team/Enterprise, der ikke har Anthropics indbyggede computer use. Pakken bygges
      #    af den SAMME binaer som ovenfor og bevises foer den haenges paa udgivelsen:
      #    den starter fra den udpakkede pakke og svarer med kildens vaerktoejstal.
      - name: Byg og bevis MCPB-pakken
        run: |
          npm i -g @anthropic-ai/mcpb@2.1.2 --no-audit --no-fund
          bash scripts/build-mcpb.sh "$RUNNER_TEMP/mcpb"
          node test/mcpb-start.mjs "$RUNNER_TEMP/mcpb/computer-mcp.mcpb"
          cp "$RUNNER_TEMP/mcpb/computer-mcp.mcpb" computer-mcp.mcpb
          shasum -a 256 computer-mcp.mcpb > computer-mcp.mcpb.sha256

      - name: Beskriv hvad der er bygget
        id: describe
        run: |
          B=mcp-server/vendor/cmcp-helper
          {
            echo "archs=$(lipo -archs $B)"
            echo "sha=$(shasum -a 256 $B | cut -d' ' -f1)"
            echo "size=$(ls -lh $B | awk '{print $5}')"
          } >> "$GITHUB_OUTPUT"
          shasum -a 256 $B > cmcp-helper.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: cmcp-helper-universal
          path: |
            mcp-server/vendor/cmcp-helper
            cmcp-helper.sha256
            computer-mcp.mcpb
            computer-mcp.mcpb.sha256

      - name: Haeng den paa udgivelsen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Kontrolsummen ligger ved siden af binaeren, saa enhver kan
          # efterproeve at det de henter, er det der blev bygget her.
          gh release upload "${GITHUB_REF_NAME}" \
            mcp-server/vendor/cmcp-helper \
            cmcp-helper.sha256 \
            computer-mcp.mcpb \
            computer-mcp.mcpb.sha256 \
            --clobber

      - name: Kvittering
        run: |
          echo "### Universal binaer bygget" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Arkitekturer | ${{ steps.describe.outputs.archs }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stoerrelse | ${{ steps.describe.outputs.size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA-256 | \`${{ steps.describe.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Signeringen er **ad-hoc**, ikke notariseret." >> $GITHUB_STEP_SUMMARY
