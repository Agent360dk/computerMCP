  <script>
    (function () {
      var FRAME_ID = "01-what-the-screenshot-holds";
      window.__timelines = window.__timelines || {};

      var root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]');
      function q(sel) {
        return root.querySelector(sel);
      }

      var world = q("#f01-world");
      var field = q("#f01-field");
      var caret = q("#f01-caret");
      var dots = Array.prototype.slice.call(root.querySelectorAll("[data-f01-dot]"));

      var DOT_T0 = 0.1;
      var DOT_STEP = 0.18;
      var DOT_PITCH = 24;
      var PULL_START = 1.8;
      var PULL_DUR = 2.4;
      var LOCK_AT = PULL_START + PULL_DUR; // 4.2
      var SWAP_AT = 5.1;

      /* ------------------------------------------------------------------
         CAMERA - viewport-change, single-wrapper composite transform.
         One `cam` object, one applyCamera() writer, T = -offset * S.
         The world is authored at its final 1x layout and the shot OPENS
         scaled in (never the inverse), so the wide lands at native size and
         every label stays crisp. The detail offset is MEASURED off the
         laid-out field; the literals are only a fallback for a clone that
         has not been laid out yet.
      ------------------------------------------------------------------ */
      var offsetX = 490.5;
      var offsetY = -108.5;
      var fieldW = 300;

      var wr = world.getBoundingClientRect();
      var fr = field.getBoundingClientRect();
      if (wr.width > 0 && fr.width > 40 && fr.width < 900) {
        offsetX = fr.left + fr.width / 2 - (wr.left + wr.width / 2);
        offsetY = fr.top + fr.height / 2 - (wr.top + wr.height / 2);
        fieldW = fr.width;
      }

      // Scene 1 frames the field full-bleed at ~70% of canvas width.
      var S0 = (1920 * 0.7) / fieldW;

      var cam = { scale: S0, x: -offsetX * S0, y: -offsetY * S0 };
      function applyCamera() {
        world.style.transform = "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.scale + ")";
      }
      applyCamera(); // seed frame 0 punched-in, so a seek to t=0 lands tight

      var tl = gsap.timeline({ paused: true });

      /* ================= Scene 1 (0.0 - 1.8s) ============================
         Full-bleed on ONE secure field. Eight dots, one per 0.18s.
         Nothing else exists on screen: every other world element sits at
         opacity 0, and the vault's flat panel fills the whole magnified
         frame, so no chrome or neighbouring pane is visible.
      =================================================================== */
      for (var i = 0; i < dots.length; i++) {
        tl.fromTo(
          dots[i],
          { opacity: 0, scale: 0.35 },
          { opacity: 1, scale: 1, duration: 0.1, ease: "power2.out" },
          DOT_T0 + i * DOT_STEP
        );
      }

      /* Caret: one driver, one writer. Position steps a dot-pitch per landed
         dot (discrete reverse-search, so a seek to any frame reproduces it);
         blink is a deterministic sin square wave that freezes when the frame
         locks. GSAP never touches this element's transform, so writing it
         directly here cannot conflict with a tween. */
      var caretDrv = { t: 0 };
      tl.to(
        caretDrv,
        {
          t: 6,
          duration: 6,
          ease: "none",
          onUpdate: function () {
            var t = caretDrv.t;
            var n = 0;
            for (var k = 0; k < 8; k++) {
              if (t >= DOT_T0 + k * DOT_STEP + 0.05) n = k + 1;
            }
            caret.style.transform = "translateX(" + n * DOT_PITCH + "px)";
            var lit = t >= LOCK_AT ? true : Math.sin(Math.PI * 2 * t) > 0;
            caret.style.opacity = lit ? "1" : "0";
          }
        },
        0
      );

      /* ================= Scene 2 (1.8 - 4.2s) ============================
         The signature move: ONE steadily decelerating zoom-out, no overshoot.
         The desktop arrives around the shrinking field by OPACITY only,
         staggered 0.25s - nothing slides in, because it was always there.
      =================================================================== */
      tl.to(
        cam,
        {
          scale: 1,
          x: 0,
          y: 0,
          duration: PULL_DUR,
          ease: "power2.out",
          onUpdate: applyCamera
        },
        PULL_START
      );

      var ARRIVE = [
        ["#f01-vault-chrome", 2.1],
        ["#f01-term", 2.35],
        ["#f01-editor", 2.6],
        ["#f01-menubar", 2.85]
      ];
      for (var a = 0; a < ARRIVE.length; a++) {
        tl.fromTo(
          q(ARRIVE[a][0]),
          { opacity: 0 },
          { opacity: 1, duration: 0.7, ease: "power1.inOut" },
          ARRIVE[a][1]
        );
      }
      tl.fromTo(q("#f01-wall"), { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.inOut" }, 2.85);
      tl.fromTo(q("#f01-glow"), { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.inOut" }, 2.85);

      /* ================= Scene 3 (4.2 - 6.0s) ============================
         Camera locked, all camera motion stops. The lower third holds 0.8s,
         then swaps IN PLACE - hard cut, no fade - and holds to the end.
         Both lines share one box, so the swap moves nothing.
      =================================================================== */
      tl.fromTo(q("#f01-scrim"), { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power1.out" }, LOCK_AT);
      tl.fromTo(q("#f01-line-a"), { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, LOCK_AT);

      // The hard cut. Explicit fromTo pairs (immediateRender off) so a seek in
      // either direction reproduces the exact state; a bare .set() would record
      // its start value lazily and drift under frame-by-frame seeking.
      tl.fromTo(
        q("#f01-line-a"),
        { opacity: 1 },
        { opacity: 0, duration: 0.001, ease: "none", immediateRender: false },
        SWAP_AT
      );
      tl.fromTo(
        q("#f01-line-b"),
        { opacity: 0 },
        { opacity: 1, duration: 0.001, ease: "none", immediateRender: false },
        SWAP_AT
      );

      // Hold to the composition edge. No exit tween: this is not the final
      // frame, and the root transition is the exit.
      tl.to({ _hold: 0 }, { _hold: 1, duration: 0.01, ease: "none" }, 5.99);

      window.__timelines[FRAME_ID] = tl;
      tl.seek(0);
    })();
  </script>
