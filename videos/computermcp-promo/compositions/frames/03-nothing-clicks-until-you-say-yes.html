  <script>
    (function () {
      var FRAME = "03-nothing-clicks-until-you-say-yes";
      var root = document.querySelector('[data-composition-id="' + FRAME + '"]');
      var one = function (sel) { return root.querySelector(sel); };
      var all = function (sel) { return root.querySelectorAll(sel); };

      var world = one(".world");
      var term = one(".term");
      var caret = one(".caret");
      var dialog = one(".dialog");
      var btnRow = one(".btn-row");
      var ring = one(".btn-ring");
      var refused = one(".refused");
      var timer = one(".timer");
      var timerFill = one(".timer-fill");
      var cursor = one(".cursor");
      var lowerRule = one(".lower-rule");
      var words = all(".lower-line .w");

      var tl = gsap.timeline({ paused: true });

      /* --- starting states, owned by the timeline (not CSS) --- */
      tl.set(dialog, { opacity: 0 }, 0);
      tl.set(timer, { opacity: 0 }, 0);
      tl.set(timerFill, { scaleX: 1 }, 0);
      tl.set(ring, { opacity: 0 }, 0);
      tl.set(refused, { opacity: 0 }, 0);
      tl.set(lowerRule, { opacity: 0, scaleX: 0 }, 0);
      tl.set(words, { opacity: 0, y: 26 }, 0);

      /* --- Scene 1 (0.0-1.4s): the terminal is already there; the cursor sets off --- */
      tl.fromTo(term, { opacity: 0.84, scale: 0.986 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, 0);
      tl.fromTo(world, { scale: 1 }, { scale: 1.028, duration: 1.4, ease: "none" }, 0);
      tl.fromTo(cursor, { x: -130, y: 840, scale: 1 }, { x: 571, y: 694, scale: 1, duration: 1.3, ease: "none" }, 0.1);

      /* prompt caret, stepped rather than looped so every seek lands the same */
      for (var i = 0; i < 9; i++) {
        var t = i * 0.58;
        tl.set(caret, { opacity: 1 }, t);
        tl.set(caret, { opacity: 0.08 }, t + 0.31);
      }

      /* --- Scene 2 (1.4-2.2s): the dialog cuts in hard; the cursor stops dead --- */
      tl.set(term, { opacity: 0.46, filter: "blur(3px)" }, 1.4);
      tl.set(dialog, { opacity: 1 }, 1.4);
      tl.fromTo(cursor, { scale: 1 }, { scale: 0.9, duration: 0.09, ease: "power2.out" }, 1.4);
      tl.fromTo(cursor, { scale: 0.9 }, { scale: 1, duration: 0.24, ease: "power2.out" }, 1.49);
      tl.fromTo(world, { scale: 1.028, y: 0 }, { scale: 1.048, y: -8, duration: 0.52, ease: "power3.out" }, 1.4);
      tl.fromTo(ring, { opacity: 0.85, scale: 1 }, { opacity: 0, scale: 1.2, duration: 0.62, ease: "power2.out" }, 1.6);

      /* --- Scene 3 (2.2-3.8s): the hairline drains, left to right. Nobody answers. --- */
      tl.set(timer, { opacity: 1 }, 2.02);
      tl.fromTo(timerFill, { scaleX: 1 }, { scaleX: 0, duration: 1.6, ease: "none" }, 2.2);

      /* --- Scene 4 (3.8-5.0s): it resolves to Refused, in muted gray. Never green. --- */
      tl.fromTo(btnRow, { opacity: 1, filter: "grayscale(0)" }, { opacity: 0.15, filter: "grayscale(1)", duration: 0.3, ease: "power2.out" }, 3.8);
      tl.fromTo(refused, { opacity: 0.15, scale: 1.18, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.52, ease: "expo.out" }, 3.86);
      tl.fromTo(lowerRule, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.42, ease: "power3.out" }, 3.98);
      tl.fromTo(words, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.085 }, 4.06);
      tl.fromTo(world, { scale: 1.048 }, { scale: 1.062, duration: 1.0, ease: "none" }, 4.0);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME] = tl;
      tl.seek(0);
    })();
  </script>
