  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      var STEP_ON = "#3fb950";

      /* --- the black field is armed at 0 and lands on ONE frame later --- */
      tl.set("#f02bbf-black", { opacity: 0 }, 0);

      /* --- Scene 1 (0.0-1.2s): the rail seats itself under the dimmed desktop --- */
      tl.fromTo("#f02bbf-rail", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.1);

      for (var i = 0; i < 4; i++) {
        tl.fromTo(
          "#f02bbf-node-" + i,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
          0.3 + i * 0.13
        );
        tl.fromTo(
          "#f02bbf-step-" + i,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
          0.36 + i * 0.13
        );
      }

      /* one step lighting up: label goes accent, the node fills, one finite pulse */
      function light(idx, at) {
        tl.to("#f02bbf-step-" + idx, { color: STEP_ON, duration: 0.22, ease: "power2.out" }, at);
        tl.to("#f02bbf-fill-" + idx, { opacity: 1, duration: 0.2, ease: "power2.out" }, at);
        tl.fromTo(
          "#f02bbf-pulse-" + idx,
          { scale: 1, opacity: 0.85 },
          { scale: 3.4, opacity: 0, duration: 0.7, ease: "power2.out" },
          at
        );
      }

      /* --- Scene 2 (1.2-2.4s): capture - the frame exists, in memory only --- */
      light(0, 1.2);
      tl.fromTo(
        "#f02bbf-capture-outline",
        { opacity: 0, scale: 1.035 },
        { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" },
        1.32
      );
      tl.fromTo(
        "#f02bbf-memtag",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        1.58
      );

      /* --- Scene 3 (2.4-3.6s): find - the secure field strokes in --- */
      light(1, 2.4);
      var outline = document.getElementById("f02bbf-field-outline");
      var len = 2070;
      if (outline && typeof outline.getTotalLength === "function") {
        len = outline.getTotalLength() || 2070;
      }
      if (outline) {
        outline.style.strokeDasharray = String(len);
        outline.style.strokeDashoffset = String(len);
      }
      tl.fromTo(
        "#f02bbf-field-outline",
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: 0.72, ease: "power2.out" },
        2.58
      );

      /* --- Scene 4 (3.6-4.6s): paint - pure #000, one frame, no fade, no scale --- */
      light(2, 3.6);
      tl.set("#f02bbf-black", { opacity: 1 }, 3.92);

      /* --- Scene 5 (4.6-5.6s): write - only NOW does a file exist --- */
      light(3, 4.6);
      tl.fromTo(
        "#f02bbf-chip",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        4.88
      );

      /* --- Scene 6 (5.6-7.0s): the line, then stillness --- */
      tl.fromTo(
        "#f02bbf-caption",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        5.62
      );

      window.__timelines["02-black-before-the-file"] = tl;
    })();
